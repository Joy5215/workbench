<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f2ec">
<link rel="icon" href="data:,">
<meta name="google" content="notranslate">
<title>我的工作台</title>
<style>
/* 样式层。构建时原样内联进 <style>，运行时不发额外请求。 */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#f7f6f1;color:#2b2d29;
 font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
 -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;border:0;outline:0;background:none}

/* ---------- 外壳 ---------- */
.app{height:100dvh;display:grid;grid-template-columns:208px 1fr;overflow:hidden}
.app.mini{grid-template-columns:64px 1fr}

/* ---------- 侧边栏 ---------- */
.side{background:#f4f2ec;border-right:1px solid #e2dfd5;padding:15px 10px 10px;
 display:flex;flex-direction:column;gap:1px;overflow:hidden;transition:padding .18s}
.side>.grow{flex:1}
.brand{display:flex;align-items:center;gap:9px;padding:3px 8px 15px;white-space:nowrap}
.avatar{width:25px;height:25px;border-radius:6px;background:#3b3d38;flex:none;position:relative}
.avatar::after{content:"";position:absolute;inset:7px;border:1.5px solid rgba(255,255,255,.5);border-radius:1.5px}
.brand b{font-size:13px;font-weight:700;letter-spacing:-.01em;color:#33352f}

.nav{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:7px;
 font-size:13px;color:#5c5f56;text-align:left;width:100%;white-space:nowrap;transition:background .12s}
.nav:hover{background:#eceae2}
.nav.on{background:#e6e3d9;color:#252722;font-weight:650}
.nav svg{width:15px;height:15px;flex:none}
.nav .lb{flex:1;overflow:hidden;text-overflow:ellipsis}
.nav .cnt{font-size:11px;color:#8d8a80;font-variant-numeric:tabular-nums;flex:none;min-width:12px;text-align:right}
.nav.on .cnt{color:#6d7066}
.nav .cnt:empty{display:none}

.fold{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:7px;font-size:12px;color:#8d8a80;width:100%;white-space:nowrap}
.fold:hover{background:#eceae2;color:#5c5f56}
.fold svg{width:14px;height:14px;flex:none;transition:transform .2s}
.fold b{font-weight:400}
.app.mini .fold svg{transform:rotate(180deg)}

.sync{display:flex;align-items:center;gap:7px;font-size:10.5px;color:#a8a59b;
 padding:9px 9px 3px;margin-top:6px;border-top:1px solid #e6e3d9;white-space:nowrap}
.dot{width:5px;height:5px;border-radius:50%;background:#2f6b4f;flex:none}

.app.mini .brand b,.app.mini .nav .lb,.app.mini .nav .cnt,
.app.mini .fold b,.app.mini .sync .st{display:none}
.app.mini .nav,.app.mini .fold{justify-content:center;padding:9px 0}
.app.mini .brand{justify-content:center;padding:3px 0 15px}
.app.mini .sync{justify-content:center;padding:9px 0 3px}

/* ---------- 主区 ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:#fdfdfb}
.topbar{display:flex;align-items:center;gap:11px;padding:11px 24px;min-height:53px;
 border-bottom:1px solid #eeece5;background:#fdfdfb}
.crumb{font-size:12px;color:#a8a59b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:#3b3d38;font-size:13.5px;font-weight:650;margin-left:2px}
.acts{margin-left:auto;display:flex;gap:6px;flex:none}
.pill{font-size:11.5px;color:#6d7066;border:1px solid #e2dfd5;border-radius:6px;
 padding:5px 11px;background:#fbfaf7;white-space:nowrap;transition:.12s}
.pill:hover{background:#f4f2ec;border-color:#d5d1c5}
.burger{display:none;width:32px;height:32px;place-items:center;border-radius:6px;color:#5c5f56;flex:none}
.burger:hover{background:#f2f0e9}

.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:26px 28px 72px}
.wrap{max-width:712px;margin:0 auto}
.page-h{font-size:22px;font-weight:750;letter-spacing:-.02em;color:#1f211e}
.page-s{font-size:11.5px;color:#a8a59b;margin-top:4px;letter-spacing:.01em}

/* 输入行 */
.entry{display:flex;align-items:center;gap:8px;margin:20px 0 4px;
 border:1px solid #e2dfd5;border-radius:8px;background:#fff;padding:0 5px 0 13px;transition:.15s}
.entry:focus-within{border-color:#adc3b6;box-shadow:0 0 0 3px rgba(47,107,79,.07)}
.entry>input{flex:1;padding:11px 0;font-size:13.5px;min-width:0}
.entry>input::placeholder{color:#bcb9ae}
.entry>.b{flex:none;background:#2f6b4f;color:#fff;font-size:12px;font-weight:650;
 padding:6px 14px;border-radius:6px;margin:5px 0;white-space:nowrap;transition:.12s}
.entry>.b:hover{background:#27583f}
.entry>.b:active{transform:translateY(1px)}

/* 列表 */
.list{margin-top:6px}
.row{display:flex;align-items:flex-start;gap:11px;padding:12px 2px;border-bottom:1px solid #f2f0e9;position:relative}
.row.inb{gap:0;padding-left:0}
.row:last-child{border-bottom:0}
.cb{width:15px;height:15px;border-radius:4px;border:1.5px solid #c9c6bc;flex:none;
 margin-top:2px;transition:.12s;position:relative}
.cb:hover{border-color:#2f6b4f}
.cb.done{background:#2f6b4f;border-color:#2f6b4f}
.cb.done::after{content:"";position:absolute;left:4.2px;top:1.2px;width:4.4px;height:8px;
 border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
.tx{flex:1;min-width:0}
.tx .t{font-size:13.5px;color:#33352f;line-height:1.55;word-break:break-word}
.tx .t.done{color:#a8a59b;text-decoration:line-through;text-decoration-thickness:1px}
.pin{width:10px;height:10px;fill:#d9a441;display:inline-block;vertical-align:1.5px;margin-right:5px}
.meta{font-size:10.5px;color:#b8b5ab;margin-top:4px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.meta .tag{color:#8d9c92;background:#eef3f0;padding:1px 6px;border-radius:4px;font-size:10px}

.act{margin-left:auto;display:flex;gap:1px;opacity:0;transition:opacity .12s;flex:none}
.row:hover .act{opacity:1}
@media(hover:none){.act{opacity:1}}
.act button{width:27px;height:27px;border-radius:5px;display:grid;place-items:center;color:#b8b5ab;transition:.12s}
.act button:hover{background:#f2f0e9;color:#5c5f56}
.act button svg{width:15px;height:15px}
.act button[data-star]{color:#a8a59b}
.act button[data-star]:hover{color:#d9a441}
.act button[data-star].on{color:#d9a441}
.act button[data-star].on:hover{color:#b8862f}
.act button.del:hover{color:#b4574a;background:#f8efed}
.act .ox{font-size:10.5px;padding:0 8px;width:auto;height:27px;white-space:nowrap;color:#6d7066;border:1px solid #e6e3d9}
.act .ox:hover{background:#f4f7f4;border-color:#bfd3c7;color:#2f6b4f}

.grp{font-size:10.5px;letter-spacing:.11em;color:#a8a59b;font-weight:700;
 margin:28px 0 2px;display:flex;align-items:center;gap:9px}
.grp::after{content:"";flex:1;height:1px;background:#eeece5}

/* 空状态 */
.empty{padding:46px 20px 30px;text-align:center}
.empty .ic{width:46px;height:46px;margin:0 auto 14px;border-radius:13px;background:#f2f0e9;
 display:grid;place-items:center;color:#b8b5ab}
.empty .ic svg{width:22px;height:22px}
.empty .t1{font-size:13.5px;color:#5c5f56;font-weight:600}
.empty .t2{font-size:12px;color:#a8a59b;margin-top:6px;line-height:1.75}
.empty .t2 kbd{font:inherit;font-size:11px;background:#f2f0e9;border:1px solid #e6e3d9;
 border-radius:4px;padding:1px 5px;color:#6d7066}

/* 统计卡 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:22px}
.stat{background:#fbfaf7;border:1px solid #eae7dd;border-radius:10px;padding:16px 16px 14px}
.stat .n{font-size:26px;font-weight:750;letter-spacing:-.03em;color:#1f211e;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:11.5px;color:#a8a59b;margin-top:6px}
.stat.hot .n{color:#2f6b4f}

/* 待建设 */
.soon{margin-top:24px;border:1px dashed #ddd8ca;border-radius:10px;padding:26px 22px;background:#fbfaf7}
.soon .t1{font-size:13.5px;font-weight:650;color:#5c5f56;margin-bottom:8px}
.soon .t2{font-size:12px;color:#98958b;line-height:1.85}
.soon .t2 b{color:#6d7066;font-weight:600}

/* 浮动提示（删除撤销 / 导出反馈） */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);
 background:#2b2d29;color:#f0eee6;border-radius:9px;padding:8px 8px 8px 15px;
 display:flex;align-items:center;gap:10px;font-size:12.5px;line-height:1.4;
 box-shadow:0 10px 30px -12px rgba(0,0,0,.55);opacity:0;pointer-events:none;
 transition:opacity .18s,transform .18s;z-index:60;max-width:calc(100vw - 28px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.q{bottom:82px}
@media(max-width:860px){.toast.q{bottom:74px}}
.toast .m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{flex:none;color:#93d3ae;font-size:12.5px;font-weight:650;padding:3px 8px;border-radius:5px}
.toast button:hover{background:rgba(255,255,255,.08)}

/* ---------- 同步页 ---------- */
.syc{background:#fbfaf7;border:1px solid #eae7dd;border-radius:11px;padding:19px 20px 17px;margin-top:18px}
.syc .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
.syc .hd .tt{font-size:13.5px;font-weight:650;color:#3d3f36}
.syc .st{font-size:10.5px;padding:2px 9px;border-radius:20px;background:#eee9d8;color:#8a7b3f;font-weight:650;white-space:nowrap;letter-spacing:.02em}
.syc .st.on{background:#dcefe2;color:#2f6b4f}
.syc .st.off{background:#f1efe8;color:#9c988c}
.syc .rw{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid #f1eee5;font-size:12.5px;line-height:1.6}
.syc .rw:last-of-type{border-bottom:0}
.syc .rw .k{color:#8a877c;flex:none}
.syc .rw .v{color:#3d3f36;font-weight:600;text-align:right;word-break:break-word}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
.btnrow button{flex:none;border:1px solid #ded9c9;background:#fff;color:#4a4c42;
  font-size:12.5px;font-weight:600;padding:8px 15px;border-radius:7px;cursor:pointer;
  font-family:inherit;transition:background .14s,border-color .14s}
.btnrow button:hover{background:#f7f5ee;border-color:#cfc9b6}
.btnrow button.primary{background:#2f6b4f;border-color:#2f6b4f;color:#fff}
.btnrow button.primary:hover{background:#27583f}
.btnrow button:disabled{opacity:.45;cursor:not-allowed}
.btnrow button:disabled:hover{background:#fff;border-color:#ded9c9}
.btnrow button.primary:disabled:hover{background:#2f6b4f;border-color:#2f6b4f}
.hint{margin-top:13px;font-size:11.5px;color:#9c988c;line-height:1.85}
.hint b{color:#6b6d62;font-weight:650}
.hint .warn{color:#a8712c}
.syc .rw.stp .k{width:15px;flex:none;color:#ada99e;font-variant-numeric:tabular-nums}
.syc .rw.stp .v{text-align:left;font-weight:400;color:#585a50;flex:1}

#scrim{display:none}
.foot-note{font-size:10.5px;color:#c2bfb4;margin-top:34px;line-height:1.7}

/* ---------- 窄屏 ---------- */
@media(max-width:860px){
  .app,.app.mini{grid-template-columns:1fr}
  .side{position:fixed;top:0;bottom:0;left:0;width:248px;z-index:30;
   transform:translateX(-100%);transition:transform .22s cubic-bezier(.4,0,.2,1);
   box-shadow:10px 0 32px -6px rgba(0,0,0,.30)}
  .app.drawer .side{transform:none}
  .app.mini .brand b,.app.mini .nav .lb,.app.mini .nav .cnt,
  .app.mini .fold b,.app.mini .sync .st{display:inline}
  .app.mini .nav,.app.mini .fold{justify-content:flex-start;padding:8px 9px}
  .app.mini .brand{justify-content:flex-start;padding:3px 8px 15px}
  .app.mini .sync{justify-content:flex-start}
  .app.mini .fold{display:none}
  #scrim{display:block;position:fixed;inset:0;background:rgba(28,30,27,.46);z-index:25;
   opacity:0;pointer-events:none;transition:opacity .22s}
  .app.drawer #scrim{opacity:1;pointer-events:auto}
  .burger{display:grid}
  .fold{display:none}
  .topbar{padding:9px 14px;min-height:50px}
  .body{padding:20px 15px 80px}
  .page-h{font-size:20px}
  .stats{grid-template-columns:1fr 1fr;gap:9px}
  .stat:nth-child(3){grid-column:1/-1}
  .act{opacity:1}
}

/* ---------- 四象限 ----------
   照滴答清单：2×2 撑满屏、不滚动，每格内部自己滚。
   .body 在四象限时去掉 padding 并改成 flex 列，否则格子撑不出「满屏」的高度。 */
.body.qmode{padding:0;overflow:hidden;display:flex;flex-direction:column}
.qwrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:9px 11px 11px;gap:9px}

/* 收集箱窄条 */
.qbar{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;
 background:#fff;border:1px solid #eae7dd;font-size:12.5px;color:#4a4c42;text-align:left;width:100%}
.qbar:hover{background:#fbfaf7}
.qbar-ic{display:grid;place-items:center;color:#2f6b4f;flex:none}
.qbar-ic svg{width:15px;height:15px}
.qbar-t{flex:1;font-weight:600}
.qbar-n{font-size:11.5px;font-weight:700;color:#2f6b4f;background:#e6f0ea;border-radius:20px;
 padding:1px 9px;font-variant-numeric:tabular-nums}

/* 2×2 网格 */
.quad{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:9px}
.qc{background:#fff;border:1px solid #eae7dd;border-radius:12px;padding:11px 11px 8px;
 display:flex;flex-direction:column;min-height:0;overflow:hidden}
.qh{flex:none;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.qh .qd{width:7px;height:7px;border-radius:50%;background:var(--qc);flex:none}
.qh .qt{flex:1;font-size:12px;font-weight:650;color:#3d3f36;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.qh .qn{font-size:10.5px;color:#bcb9ae;font-variant-numeric:tabular-nums;flex:none}

/* 格内列表：自己滚，滚到顶不带动外面 */
.qlist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -4px}
.qrow{display:flex;align-items:flex-start;gap:9px;padding:7px 4px;border-radius:7px;cursor:default}
.qrow:hover{background:#faf9f5}
.qrow .cb{margin-top:1px}
.qtx{flex:1;min-width:0}
.qtx .qt1{font-size:12.5px;line-height:1.45;color:#33352f;word-break:break-word}
.qtx .qt2{font-size:10.5px;color:#b0ada2;margin-top:1px;font-variant-numeric:tabular-nums}

/* 格内录入（只在这一格被选中时出现） */
.qform{flex:none;display:flex;gap:5px;margin-top:5px;padding-top:6px;border-top:1px solid #f2f0e9}
.qform input{flex:1 1 auto;min-width:0;font-size:12.5px;padding:5px 7px;border:1px solid #e2dfd5;
 border-radius:6px;background:#fdfdfb}
.qform input:focus{border-color:#adc3b6;outline:none}
.qform .qok{flex:none;font-size:11.5px;font-weight:650;color:#2f6b4f;padding:0 10px;border-radius:6px}
.qform .qok:hover{background:#eef4f0}

/* 右下角悬浮 + */
.fab{position:absolute;right:18px;bottom:20px;width:50px;height:50px;border-radius:50%;
 background:#2f6b4f;color:#fff;display:grid;place-items:center;
 box-shadow:0 8px 20px -6px rgba(47,107,79,.55);transition:.15s;z-index:5}
.fab:hover{background:#27583f}
.fab:active{transform:scale(.94)}
.fab svg{width:22px;height:22px}
.main{position:relative}

@media(max-width:860px){
  .qwrap{padding:7px 8px 8px;gap:7px}
  .quad{gap:7px}
  .qc{padding:9px 9px 6px;border-radius:10px}
  .qh .qt{font-size:11.5px}
  .qtx .qt1{font-size:12px}
  .qform input{font-size:12px}
  .fab{right:14px;bottom:16px;width:46px;height:46px}
}

.act button[data-imp],.act button[data-urg]{font-size:10.5px;width:24px;height:24px;
 font-weight:700;color:#c9c6bc;border-radius:5px;letter-spacing:-.02em;opacity:0;transition:.12s}
.row:hover .act button[data-imp],.row:hover .act button[data-urg]{opacity:1}
.act button[data-imp].on,.act button[data-urg].on{opacity:1}
.act button[data-imp].on{color:#a8862c;background:#f6f0dc}
.act button[data-urg].on{color:#b4574a;background:#f8eeea}
@media(hover:none){
  .act button[data-imp],.act button[data-urg]{opacity:1}
}

.seg{display:inline-flex;gap:2px;padding:3px;background:#f2f0e9;border-radius:8px;margin:14px 0 2px}
.seg .sg{font-size:12px;color:#7a7c72;padding:5px 12px;border-radius:6px;white-space:nowrap;transition:.12s}
.seg .sg:hover{color:#3d3f36}
.seg .sg.on{background:#fff;color:#2f6b4f;font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.seg .sg i{font-style:normal;font-size:10px;color:#b0ada2;margin-left:5px;font-variant-numeric:tabular-nums}
.seg .sg.on i{color:#8fb3a3}

/* ---------- 窄屏 ---------- */
@media(max-width:860px){
  .app,.app.mini{grid-template-columns:1fr}
  .side{position:fixed;top:0;bottom:0;left:0;width:248px;z-index:30;
   transform:translateX(-100%);transition:transform .22s cubic-bezier(.4,0,.2,1);
   box-shadow:10px 0 32px -6px rgba(0,0,0,.30)}
  .app.drawer .side{transform:none}
  .app.mini .brand b,.app.mini .nav .lb,.app.mini .nav .cnt,
  .app.mini .fold b,.app.mini .sync .st{display:inline}
  .app.mini .nav,.app.mini .fold{justify-content:flex-start;padding:8px 9px}
  .app.mini .brand{justify-content:flex-start;padding:3px 8px 15px}
  .app.mini .sync{justify-content:flex-start}
  .app.mini .fold{display:none}
  #scrim{display:block;position:fixed;inset:0;background:rgba(28,30,27,.46);z-index:25;
   opacity:0;pointer-events:none;transition:opacity .22s}
  .app.drawer #scrim{opacity:1;pointer-events:auto}
  .burger{display:grid}
  .fold{display:none}
  .topbar{padding:9px 14px;min-height:50px}
  .body{padding:20px 15px 80px}
  .page-h{font-size:20px}
  .stats{grid-template-columns:1fr 1fr;gap:9px}
  .stat:nth-child(3){grid-column:1/-1}
  .act{opacity:1}
}


.seg{display:inline-flex;gap:2px;padding:3px;background:#f2f0e9;border-radius:8px;margin:14px 0 2px}
.seg .sg{font-size:12px;color:#7a7c72;padding:5px 12px;border-radius:6px;white-space:nowrap;transition:.12s}
.seg .sg:hover{color:#3d3f36}
.seg .sg.on{background:#fff;color:#2f6b4f;font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.seg .sg i{font-style:normal;font-size:10px;color:#b0ada2;margin-left:5px;font-variant-numeric:tabular-nums}
.seg .sg.on i{color:#8fb3a3}

/* ---------- 底部浮层（选象限 / 收集箱清理） ---------- */
#sheet-scrim{position:fixed;inset:0;background:rgba(28,30,27,.34);z-index:40;
 opacity:0;pointer-events:none;transition:opacity .18s}
#sheet-scrim.on{opacity:1;pointer-events:auto}
.sheet-host{position:fixed;left:0;right:0;bottom:0;z-index:45;pointer-events:none;
 display:flex;justify-content:center}
.sh{pointer-events:auto;width:100%;max-width:440px;background:#fff;border-radius:14px 14px 0 0;
 padding:6px 8px 10px;box-shadow:0 -10px 30px -14px rgba(0,0,0,.35);
 animation:shup .18s cubic-bezier(.4,0,.2,1)}
@keyframes shup{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sh-h{font-size:11px;color:#a8a59b;padding:10px 10px 8px;letter-spacing:.04em}
.sh-b{display:flex;align-items:center;gap:10px;width:100%;padding:12px 10px;border-radius:9px;
 font-size:13.5px;color:#33352f;text-align:left}
.sh-b:hover{background:#f6f4ee}
.sh .qd{width:8px;height:8px;border-radius:50%;flex:none}
.sh .qd.qi{width:15px;height:15px;border-radius:0;display:grid;place-items:center;color:#5c5f56}
.sh .qd.qi svg{width:15px;height:15px}
.sh-x{display:block;width:100%;text-align:center;padding:11px;color:#8a877c;font-size:12.5px;
 border-top:1px solid #f2f0e9;margin-top:4px}
.sh-x:hover{color:#33352f}
.sh-e{text-align:center;color:#bcb9ae;font-size:12.5px;padding:22px 0}
.sh-list{max-height:52vh;overflow-y:auto;overscroll-behavior:contain}
.sh-i{padding:10px 10px;border-bottom:1px solid #f6f4ee}
.sh-i:last-child{border-bottom:0}
.sh-t{font-size:13px;color:#33352f;line-height:1.45;word-break:break-word}
.sh-a{display:flex;gap:5px;margin-top:7px;align-items:center}
.sh-a button{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;
 border:1px solid #eae7dd}
.sh-a button:hover{background:#f6f4ee}
.sh-a button .qd{width:9px;height:9px}
.sh-a .sh-del{margin-left:auto;border-color:transparent;color:#c9c6bc}
.sh-a .sh-del:hover{color:#b4574a;background:#f8eeed}
.sh-a .sh-del svg{width:14px;height:14px}

/* ---------- GitHub 通道表单 ---------- */
.ghf{display:grid;gap:9px;margin:0 0 14px}
.ghf label{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:10px}
.ghf label span{font-size:12px;color:#8a877c}
.ghf input{width:100%;min-width:0;font-size:12.5px;padding:7px 9px;border:1px solid #e2dfd5;
 border-radius:7px;background:#fdfdfb;font-family:inherit;color:#33352f}
.ghf input:focus{border-color:#adc3b6;outline:none;background:#fff}
.syc code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#f1efe8;
 padding:1px 5px;border-radius:4px;color:#5c5f56}

/* ---------- 输入区改成 textarea ---------- */
.entry{display:flex;gap:8px;align-items:flex-end}
.entry textarea{flex:1 1 auto;min-width:0;resize:none;overflow-y:auto;
 font-family:inherit;font-size:13.5px;line-height:1.5;padding:9px 11px;
 border:1px solid #e2dfd5;border-radius:8px;background:#fff;color:#33352f;
 min-height:38px;max-height:160px}
.entry textarea:focus{border-color:#adc3b6;outline:none}
.entry textarea::placeholder{color:#b8b5ab}
.entry .b{flex:none;height:38px;padding:0 15px}

/* ---------- 媒体块 ---------- */
.md1{margin:0 0 10px}
.md-fr{position:relative;width:100%;padding-top:56.25%;background:#0f1110;border-radius:10px;overflow:hidden}
.md-fr iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.md-vid{width:100%;border-radius:10px;background:#0f1110;max-height:70vh}
.md-img{display:block}
.md-img img{width:100%;border-radius:10px;display:block}
.md-go{display:flex;align-items:center;gap:9px;padding:11px 13px;border:1px solid #eae7dd;
 border-radius:10px;background:#fbfaf7;text-decoration:none}
.md-go:hover{background:#f6f4ee}
.md-go-t{font-size:12.5px;font-weight:650;color:#3d3f36;flex:none}
.md-go-u{flex:1;min-width:0;font-size:11.5px;color:#a8a59b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-go-a{flex:none;font-size:12px;color:#2f6b4f;font-weight:650}
.md1-f{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.md1-k{font-size:10.5px;color:#a8a59b;letter-spacing:.03em;flex:none}
.md1-t{font-size:12px;color:#5c5f56;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 笔记页 ---------- */
.nt{background:#fff;border:1px solid #eae7dd;border-radius:12px;padding:14px 15px 10px;margin-top:11px}
.nt-body{margin-top:4px}
.nt-body.md{font-size:13.5px;line-height:1.72;color:#33352f}
.nt-body.md h1,.nt-body.md h2,.nt-body.md h3{font-size:14.5px;font-weight:650;margin:14px 0 6px;color:#2b2d29}
.nt-body.md h1{font-size:16px}
.nt-body.md p{margin:0 0 9px}
.nt-body.md ul,.nt-body.md ol{margin:0 0 9px;padding-left:20px}
.nt-body.md li{margin:2px 0}
.nt-body.md code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;
 background:#f4f2eb;padding:1px 5px;border-radius:4px}
.nt-body.md pre{background:#f7f6f1;border:1px solid #eae7dd;border-radius:8px;
 padding:10px 12px;overflow-x:auto;margin:0 0 10px}
.nt-body.md pre code{background:none;padding:0;font-size:11.5px;line-height:1.6}
.nt-body.md a{color:#2f6b4f;text-decoration:underline;text-underline-offset:2px}
.nt-body.md blockquote{margin:0 0 9px;padding:2px 0 2px 12px;border-left:2px solid #dcd8cb;color:#6b6d63}
.nt-body.md table{border-collapse:collapse;width:100%;margin:0 0 10px;font-size:12.5px}
.nt-body.md th,.nt-body.md td{border:1px solid #eae7dd;padding:5px 8px;text-align:left}
.nt-body.md th{background:#faf9f5;font-weight:650}
.nt-body.md img{max-width:100%;border-radius:8px}
.nt-f{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:7px;border-top:1px solid #f4f2ec}
.nt-t{flex:1;font-size:10.5px;color:#b8b5ab}
.nt-b{font-size:11px;color:#8a877c;padding:3px 8px;border-radius:5px}
.nt-b:hover{background:#f2f0e9;color:#33352f}
.nt-x:hover{color:#b4574a;background:#f8eeed}

/* mermaid 图：点一下露出源码 */
.mmm{margin:0 0 12px;cursor:pointer}
.mmm img{width:100%;max-width:420px;display:block;margin:0 auto;border-radius:8px;background:#fff}
.mmm-c{display:none;margin-top:7px}
.mmm.open .mmm-c{display:block}
.mmm-c pre{background:#f7f6f1;border:1px solid #eae7dd;border-radius:7px;padding:8px 10px;
 font-size:11px;overflow-x:auto;margin:0}

/* 编辑区 */
.nted{background:#fff;border:1px solid #eae7dd;border-radius:12px;padding:14px 15px;margin-top:12px}
.nted-r{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;margin-bottom:10px}
.nted-r span{font-size:12px;color:#8a877c;padding-top:9px}
.nted-r input,.nted-r textarea{width:100%;min-width:0;font-family:inherit;font-size:13px;
 padding:8px 10px;border:1px solid #e2dfd5;border-radius:7px;background:#fdfdfb;color:#33352f;
 line-height:1.6;resize:vertical}
.nted-r input:focus,.nted-r textarea:focus{border-color:#adc3b6;outline:none;background:#fff}
.nempty{text-align:center;color:#bcb9ae;font-size:12.5px;padding:40px 0}

@media(max-width:860px){
  .entry textarea{font-size:13px}
  .nt{padding:12px 13px 8px;border-radius:10px}
  .nt-body.md{font-size:13px}
  .nted{padding:12px 13px}
  .nted-r{grid-template-columns:1fr;gap:4px}
  .nted-r span{padding-top:0}
}

/* 笔记卡片标题与 mermaid 兜底 */
.nt-h{font-size:14px;font-weight:650;color:#2b2d29;margin:0 0 9px;line-height:1.45}
.mmm-e{display:none;font-size:11.5px;color:#b4574a;text-align:center;padding:16px 0}
.mmm.bad img{display:none}
.mmm.bad .mmm-e{display:block}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand"><div class="avatar"></div><b>我的工作台</b></div>
    <nav id="nav"></nav>
    <div class="grow"></div>
    <button class="fold" id="fold">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.8 4.2L6 8l3.8 3.8"/></svg>
      <b>收起侧栏</b>
    </button>
    <div class="sync"><i class="dot"></i><span class="st" id="st">已保存 · 本地</span></div>
  </aside>
  <div id="scrim"></div>

  <div class="toast" id="toast"><span class="m"></span><button id="undo" hidden>撤销</button></div>

  <main class="main">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="菜单">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.4 4.4h11.2M2.4 8h11.2M2.4 11.6h11.2"/></svg>
      </button>
      <div class="crumb">我的工作台<b id="crumb">/ 今日</b></div>
      <div class="acts">
        <button class="pill" id="imp">导入</button>
        <button class="pill" id="exp">导出</button>
        <input type="file" id="impfile" accept="application/json,.json" hidden>
      </div>
    </header>
    <section class="body" id="body"></section>
  </main>

  <div id="sheet-scrim"></div>
  <div class="sheet-host" id="sheet"></div>
</div>

/* ================= core.js ================= */
/* ---------- core.js ----------
   纯函数层：不碰 DOM、不碰 localStorage、不碰文件系统。
   唯一目的是能脱离浏览器单测——合并算法（mergeRecords）昨晚错过三次。
   浏览器里这些都以函数声明存在，会被提升，调用顺序无关。 */

var WK = ['日','一','二','三','四','五','六'];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }


/* 删除要盖过另一台设备上「那个更晚的修改」，否则删掉的东西会自己回来。
   所以墓碑的时间戳不是「现在」，是「现在和旧 up 里更大的那个 + 1」。 */
function bumpUp(x){
  x.up = Math.max(Date.now(), (x.up || 0) + 1);
}


/* 墓碑赢过同 up 的修改，也赢过 up 更小的修改。
   不同步的删除会「复活」：B 设备那条旧记录的 up 只要比墓碑大，就会盖回来。 */
function newer(a, b){
  var ua = a.up || 0, ub = b.up || 0;
  if (ua !== ub) return ua > ub;
  if (!!a.del !== !!b.del) return !!a.del;
  return false;
}

/* 合并：同 id 比 up，大的赢；本地没有的直接收下。墓碑也是记录，一样参与比较。
   纯函数：只改传入的两个数组，不碰全局 S —— 这样能离开浏览器跑用例。
   注意 lmap 只在开头建一次，不随 push 更新，这是原实现的行为，别改。 */
/* 第三个参数 notes 是可选的。不传就照老样子只合 todos + inbox，
   tests/core.test.cjs 里那些用例因此不用改，也不会因为多了一个数组而失败。 */
function mergeRecords(todos, inbox, remote, notes){
  var lmap = {};
  todos.forEach(function(x){ lmap[x.id] = x; });
  inbox.forEach(function(x){ lmap[x.id] = x; });
  if (notes) notes.forEach(function(x){ lmap[x.id] = x; });

  var st = { add:0, upd:0, same:0, tomb:0 };
  var groups = [{ arr: remote.todos || [], to: todos },
                { arr: remote.inbox || [], to: inbox }];
  if (notes) groups.push({ arr: remote.notes || [], to: notes });
  groups.forEach(function(g){
    g.arr.forEach(function(r){
      if (!r || !r.id) return;
      var l = lmap[r.id];
      if (!l) { g.to.push(r); st.add++; return; }
      if (newer(r, l)) {
        Object.keys(r).forEach(function(k){ l[k] = r[k]; });
        if (r.del) {
          st.tomb++;
        } else {
          /* 远端这条「更晚」且没带 del 字段，说明它在那台设备上还活着。
             原来的写法只覆盖远端有的键，本地那个 del:1 会留在原地 ——
             记录内容更新了，却永久藏在墓碑里，等于凭空丢一条。
             场景：A 删了它，B 在收到删除之前又编辑了一版并同步，B 的 up 更大。 */
          if (l.del) l.del = 0;
          st.upd++;
        }
      } else {
        st.same++;
      }
    });
  });
  return st;
}

/* ---------- 时间 ---------- */
function fmt(ts){
  if (!ts) return '';
  var d = new Date(), diff = d.getTime() - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff/60000) + ' 分钟前';
  var t = new Date(ts);
  var sameDay = t.toDateString() === d.toDateString();
  if (sameDay) return Math.floor(diff/3600000) + ' 小时前';
  var y = new Date(d.getTime() - 86400000);
  if (t.toDateString() === y.toDateString()) return '昨天';
  return (t.getMonth()+1) + ' 月 ' + t.getDate() + ' 日';
}

function todayLine(){
  var d = new Date();
  return d.getFullYear() + ' 年 ' + (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日 · 星期' + WK[d.getDay()];
}

function dayKey(d){
  d = d || new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

function weekStart(){
  var d = new Date();
  var w = d.getDay() === 0 ? 7 : d.getDay();   // 周一为一周开始
  var m = new Date(d.getFullYear(), d.getMonth(), d.getDate() - w + 1);
  return m.getTime();
}

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

/* node 测试用的出口。浏览器里 module 不存在，这段整体跳过，不产生任何副作用。 */
if (typeof module !== "undefined" && module.exports) {
  module.exports = { uid: uid, bumpUp: bumpUp, newer: newer, mergeRecords: mergeRecords,
                     fmt: fmt, todayLine: todayLine, dayKey: dayKey, weekStart: weekStart,
                     esc: esc };
}

var VIEW_FN = {};

/* ================= store.js ================= */
/* ---------- store.js ----------
   数据落地：localStorage 只是缓存，workbench-sync.json 才是真身。
   还包括「存不住就得说存不住」的探测，和底部那条浮动提示。 */

/* ---------- 存储 ----------
   两层：localStorage 只是缓存，workbench-sync.json 才是真身。
   换文件名、换浏览器、清缓存，缓存全丢也没关系——json 还在，打开就收回来。
   反过来只靠 localStorage 就是这一版之前的样子：改个名数据就没了。 */
var KEY = 'myworkbench.v1';

var S = null;

/* ---------- 存储 ---------- */

/* 有些预览环境（iframe 沙箱）不给 localStorage。存不住就要说存不住，
   不能底部写着「已保存」而刷新之后什么都没了。 */
var CAN_SAVE = (function(){
  try {
    localStorage.setItem('__wb_probe__','1');
    localStorage.removeItem('__wb_probe__');
    return true;
  } catch(e){ return false; }
})();

function load(){
  var d = null;
  try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ d = null; }
  if (!d || !Array.isArray(d.todos)) {
    d = { todos:[], inbox:[], notes:[], view:'quad', mini:false, lastSave:0 };
  }
  if (!Array.isArray(d.inbox)) d.inbox = [];
  if (!d.todos) d.todos = [];
  if (!d.inbox) d.inbox = [];
  if (!d.notes) d.notes = [];
  if (!d.view) d.view = 'quad';
  /* 界面态：+ 按钮选中了哪一格、底部浮层开着什么。不进同步文件，只存本机。 */
  if (d.addQuad === undefined) d.addQuad = '';
  /* 主输入框可以拉高（粘贴长内容时）。高度是个数，不是 px，换设备也不会变形。 */
  if (d.rows === undefined) d.rows = 1;
  d.picker = false;
  d.sheet = '';

  /* 同步要用两样东西：设备标识，和每条记录的最后修改时间。
     老数据没有 up，用 created 兜底，避免一上来就被判成「最旧」。 */
  if (!d.devId) d.devId = uid();
  var t0 = Date.now();
  d.todos.concat(d.inbox).forEach(function(x){
    if (!x.up) x.up = x.created || t0;
    if (x.del === undefined) x.del = 0;
    /* 四象限的两个标记是后加的字段。老数据没有，补 0 而不是 undefined ——
       否则 mergeRecords 比 up 时 undefined 参与运算，会出现 NaN 时间戳。 */
    if (x.urg === undefined) x.urg = 0;
    if (x.imp === undefined) x.imp = 0;
  });
  return d;
}

function save(){
  /* 首屏还没做过任何写入时 localStorage 里是空的，靠它兜底 */
  if (!S) return;
  S.lastSave = Date.now();
  if (CAN_SAVE) {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ CAN_SAVE = false; }
  }
  stampSync();
}

function stampSync(){
  var el = document.getElementById('st');
  if (!el) return;
  if (!CAN_SAVE) {
    el.textContent = '临时模式 · 关掉就没了';
    clearTimeout(stampSync._t);
    return;
  }
  el.textContent = '已保存 · 刚刚';
  clearTimeout(stampSync._t);
  stampSync._t = setTimeout(function(){
    var el2 = document.getElementById('st');
    if (el2) el2.textContent = '已保存 · 本地';
  }, 2600);
}

/* ---------- 浮动提示 ---------- */
var toastFn = null, toastTimer = null;
function toast(msg, undoFn){
  var el = document.getElementById('toast');
  el.querySelector('.m').textContent = msg;
  var u = document.getElementById('undo');
  if (undoFn) { u.hidden = false; toastFn = undoFn; }
  else { u.hidden = true; toastFn = null; }
  /* 四象限页底部压着悬浮 + 和输入框，提示条得抬到它们上面，否则挡住的正是刚要打字的地方 */
  el.classList.toggle('q', !!document.querySelector('.body.qmode'));
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, undoFn ? 5200 : 2200);
}
function hideToast(){
  var el = document.getElementById('toast');
  if (el) el.classList.remove('on');
  toastFn = null;
}

/* ================= sync.js ================= */
/* ---------- sync.js ----------
   文件夹同步：句柄存 IndexedDB、写入后读回点数、启动时悄悄看一眼远端。
   合并算法的本体在 core.js 的 mergeRecords()，这里只是把本地状态递进去。 */

/* 合并的入口：把 S 里的两个数组交给纯函数，返回统计。 */
function mergeInto(remote){
  return mergeRecords(S.todos, S.inbox, remote, S.notes);
}

/* ==========================================================
   同步模块 · 文件通道
   ----------------------------------------------------------
   为什么不直接调百度网盘 API：2026-11-17 在浏览器里实测三条请求
   （简单 GET / 带 Authorization / PUT），全部 TypeError: Failed to fetch，
   控制台原文 blocked by CORS policy: No Access-Control-Allow-Origin。
   请求发出去了，服务端也答了，只是浏览器不许页面读结果。
   浏览器拦不住的是「往用户已授权的本地文件夹写文件」，所以走这条。
   ========================================================== */

var SYNC_FILE = 'workbench-sync.json';
var syncHandle = null;
var SY = { perm:'none', at:0, busy:false, note:'' };

/* --- 目录句柄存 IndexedDB。刷新后还在，但写入权限可能要再确认一次 --- */
function idbOp(mode, fn){
  return new Promise(function(res){
    var req;
    try { req = indexedDB.open('wb-sync', 1); } catch(e){ res(null); return; }
    req.onupgradeneeded = function(){ req.result.createObjectStore('kv'); };
    req.onerror = function(){ res(null); };
    req.onsuccess = function(){
      try {
        var tx = req.result.transaction('kv', mode);
        fn(tx.objectStore('kv'), res);
      } catch(e){ res(null); }
    };
  });
}
function idbGet(k){
  return idbOp('readonly', function(st, res){
    var q = st.get(k);
    q.onsuccess = function(){ res(q.result || null); };
    q.onerror = function(){ res(null); };
  });
}
function idbSet(k, v){
  return idbOp('readwrite', function(st, res){ st.put(v, k); res(v); });
}
function idbDel(k){
  return idbOp('readwrite', function(st, res){ st.delete(k); res(true); });
}

function hasFSA(){
  return !!(window.showDirectoryPicker && window.isSecureContext);
}

async function permOf(h, ask){
  if (!h) return 'none';
  try {
    var o = { mode:'readwrite' };
    var p = await h.queryPermission(o);
    if (p !== 'granted' && ask) p = await h.requestPermission(o);
    return p;
  } catch(e){ return 'none'; }
}

async function pickFolder(){
  if (!hasFSA()) { toast('这个浏览器不支持选文件夹'); return; }
  if (SY.busy) return;
  SY.busy = true; SY.note = '';
  render({});
  try {
    var h = await window.showDirectoryPicker({ mode:'readwrite', id:'wb-sync' });
    syncHandle = h;
    await idbSet('dir', h);
    SY.perm = await permOf(h, false);
    SY.busy = false;
    toast('已连接「' + (h.name || '这个文件夹') + '」');
    render({});
    await syncNow('full', { silent:true });
    return;
  } catch(e){
    if (e.name !== 'AbortError') { SY.note = '选择失败：' + (e.message || e.name); }
  }
  SY.busy = false;
  render({});
}

async function forgetFolder(){
  syncHandle = null;
  SY.perm = 'none'; SY.at = 0; SY.note = '';
  await idbDel('dir');
  render({});
  toast('已断开，文件夹里的文件没动');
}

/* 写：写完读回来点数。不能只凭 close() 没报错就说成功。 */
async function pushRemote(){
  if (!syncHandle) throw new Error('还没有选择文件夹');
  var perm = await permOf(syncHandle, true);
  if (perm !== 'granted') throw new Error('浏览器没给写入权限');
  var fh = await syncHandle.getFileHandle(SYNC_FILE, { create:true });
  var w = await fh.createWritable();
  var payload = {
    v: 2,
    devId: S.devId,
    savedAt: Date.now(),
    todos: S.todos,
    inbox: S.inbox,
    notes: S.notes || []
  };
  await w.write(JSON.stringify(payload, null, 1));
  await w.close();

  var f = await fh.getFile();
  var back = JSON.parse(await f.text());
  var got = (back.todos || []).length + (back.inbox || []).length;
  var want = S.todos.length + S.inbox.length;
  if (got !== want) throw new Error('写回条数不对：应 ' + want + ' 实 ' + got);
  return back;
}

async function fetchRemote(){
  if (!syncHandle) throw new Error('还没有选择文件夹');
  var perm = await permOf(syncHandle, true);
  if (perm !== 'granted') throw new Error('浏览器没给读取权限');
  var fh;
  try { fh = await syncHandle.getFileHandle(SYNC_FILE); }
  catch(e){ return null; }
  var txt = await (await fh.getFile()).text();
  if (!txt || !txt.trim()) return null;
  return JSON.parse(txt);
}

/* 墓碑留 30 天足够让所有设备都收到，之后就清掉，否则文件只增不减 */
function sweep(){
  var cut = Date.now() - 30 * 86400000;
  var n0 = S.todos.length + S.inbox.length + (S.notes || []).length;
  S.todos = S.todos.filter(function(x){ return !(x.del && (x.up || 0) < cut); });
  S.inbox = S.inbox.filter(function(x){ return !(x.del && (x.up || 0) < cut); });
  S.notes = (S.notes || []).filter(function(x){ return !(x.del && (x.up || 0) < cut); });
  return n0 - (S.todos.length + S.inbox.length + (S.notes || []).length);
}

async function syncNow(mode, opt){
  opt = opt || {};
  if (SY.busy) return;
  if (!syncHandle) { toast('先选一个同步文件夹'); return; }
  SY.busy = true; SY.note = '';
  render({});
  try {
    var st = null, back = null;

    if (mode !== 'up') {
      var remote = await fetchRemote();
      if (remote) {
        st = mergeInto(remote);
      } else if (mode === 'down') {
        SY.note = '文件夹里还没有 ' + SYNC_FILE + '，这台设备可能是第一个';
      }
    }

    if (mode !== 'down') {
      back = await pushRemote();
      SY.at = back.savedAt;
    }

    sweep();
    save();
    SY.perm = 'granted';
    SY.busy = false;
    render({});

    if (opt.silent) {
      if (st && (st.add || st.upd || st.tomb)) {
        toast('合并了 ' + (st.add + st.upd) + ' 条来自另一台设备');
      }
      return;
    }
    if (st && (st.add || st.upd || st.tomb)) {
      toast('同步完成：新增 ' + st.add + ' · 更新 ' + st.upd
        + (st.tomb ? ' · 删除 ' + st.tomb : '') + ' · 未变 ' + st.same);
    } else if (st) {
      toast('两边一致，没有要合的东西');
    } else {
      toast('已写入同步文件夹');
    }
  } catch(e){
    SY.busy = false;
    SY.note = e.message || String(e);
    render({});
    toast('同步失败：' + SY.note);
  }
}

/* 启动时悄悄看一眼：远端比本地新就提示一句，不擅自改数据 */
async function autocheck(){
  try {
    var h = await idbGet('dir');
    if (!h) return;
    syncHandle = h;
    SY.perm = await permOf(h, false);
    if (SY.perm !== 'granted') { if (S.view === 'sync') render({}); return; }
    var remote = await fetchRemote();

    /* 文件夹里连 json 都没有 —— 这台设备是第一次连，把现在的数据种进去，
       否则网盘里永远只有一个 html，换台电脑打开就是空的。 */
    if (!remote) {
      var n0 = S.todos.length + S.inbox.length + (S.notes || []).length;
      if (n0) {
        await pushRemote();
        toast('已把这台设备的 ' + n0 + ' 条记录写进文件夹');
      } else {
        SY.note = '文件夹里还没有 ' + SYNC_FILE + '，这台设备也没有数据';
      }
      if (S.view === 'sync') render({});
      return;
    }

    /* 本地缓存丢了（换了文件名 / 换了浏览器 / 清了缓存）而文件夹里有数据：
       直接收下。这条是「换了台电脑打开是空的」的正解。 */
    var emptyLocal = !S.todos.length && !S.inbox.length;
    var remoteN = (remote.todos || []).length + (remote.inbox || []).length;
    if (emptyLocal && remoteN) {
      var got = mergeInto(remote);
      save(); render({});
      toast('已从文件夹恢复 ' + got.add + ' 条记录');
      return;
    }

    /* 两边都有：照常合并。以前这里只弹一句「另一台有更新」就不管了，
       等于把「打开就能看到别人的改动」这个最基本的要求丢了。 */
    if (!emptyLocal && remoteN) {
      var st = mergeInto(remote);
      if (st.add || st.upd || st.tomb) {
        save(); render({});
        toast('从文件夹同步了 ' + (st.add + st.upd) + ' 条'
          + (st.tomb ? '，删除 ' + st.tomb + ' 条' : ''));
        return;
      }
    }
    if (S.view === 'sync') render({});
  } catch(e){}
}

function viewSync(){

  var granted = SY.perm === 'granted';

  var h = '<div class="wrap"><h1 class="page-h">同步</h1>'

    }
    h += '</div>';
  }

  /* 卡片二：接线步骤 */
  h += '<div class="syc"><div class="hd"><span class="tt">怎么接百度网盘</span>'
    + '<span class="st off">文件通道</span></div>'
    + '<div class="rw stp"><span class="k">1</span><span class="v">电脑上装百度网盘客户端，打开「同步空间」</span></div>'

    + '<div class="hint">写进去的文件叫 <b>' + SYNC_FILE + '</b>，几十 KB。'
    + '百度网盘免费版每月给 1GB 同步流量，这点量用不完。'
    + '<br>手机浏览器不给网页选文件夹的能力，所以这一步只能在一台电脑上做——是浏览器的限制，不是功能没做。</div></div>';

    + '全部返回 <b>TypeError: Failed to fetch</b>，控制台原文是 '
    + '<b>blocked by CORS policy: No “Access-Control-Allow-Origin” header</b>。'
    + '请求确实发出去了，服务端也答了，只是浏览器不许页面读结果。<br><br>'
    + '浏览器管不了的是「往你亲手授权的本地文件夹写文件」。所以这一版走文件，不走接口。</div></div>';

  h += '<div class="foot-note">冲突按每条记录的最后修改时间判，大头留给新的那份。'
    + '两台设备时钟差得多时可能判错，所以启动时只提示、不自动覆盖——要合就点「立即同步」，一次算完。</div>';

  return h + '</div>';
}

/* ================= sync-gh.js ================= */
/* ---------- sync-gh.js ----------
   GitHub 通道：把同步文件放进仓库，前端直接调 Contents API 读写。

   为什么这条能成、而百度网盘 / 坚果云 / 飞书都不行 —— 2026-11-18 实测：
     api.github.com 的 OPTIONS 预检返回
       access-control-allow-origin: *
       access-control-allow-methods: GET, POST, PATCH, PUT, DELETE
       access-control-allow-headers: Authorization, Content-Type, If-Match, ...
     连一个 401 的响应也照带 allow-origin。那三家的响应里没有这个头。

   代价说清楚：
   1. token 存在本机 localStorage。XSS 能拿走它。所以必须用 fine-grained token，
      只授权这一个仓库的 Contents 读写，泄露了也只影响这一个文件。
   2. 仓库是 public 的话，这个 json 人人都能看。要私密就换私有仓库（Pages 照样能用）。
   3. 一次 PUT 上限 1MB，装几万条待办够用；超过会在写入前先报错。 */

var GH_KEY = 'myworkbench.gh';
var GH = { busy:false, note:'', at:0 };

function ghCfg(){
  try { return JSON.parse(localStorage.getItem(GH_KEY)) || {}; }
  catch(e){ return {}; }
}
function ghSet(cfg){
  try { localStorage.setItem(GH_KEY, JSON.stringify(cfg)); } catch(e){}
}
function ghReady(){
  var c = ghCfg();
  return !!(c.repo && c.token);
}
/* 允许用户只填 "owner/repo" 或者整个 https 地址，都认 */
function ghSplitRepo(v){
  var s = String(v || '').trim()
    .replace(/^https?:\/\/github\.com\//, '')
    .replace(/\.git$/, '')
    .replace(/\/+$/, '');
  var m = s.split('/');
  if (m.length < 2 || !m[0] || !m[1]) return null;
  return { owner: m[0], repo: m[1] };
}

/* ---------- base64：中文字符串不能直接 btoa ---------- */
function b64enc(str){
  var bytes = new TextEncoder().encode(str);
  var bin = '';
  var CH = 0x8000;
  for (var i = 0; i < bytes.length; i += CH) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  return btoa(bin);
}
function b64dec(s){
  var bin = atob(String(s || '').replace(/\s/g, ''));
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ---------- 一次 API 调用 ----------
   统一把 GitHub 的错误体翻成一句人话，否则页面上只会看到 "409"。 */
function ghApi(path, opt){
  opt = opt || {};
  var c = ghCfg();
  var headers = {
    'Authorization': 'Bearer ' + c.token,
    'Accept': 'application/vnd.github+json'
  };
  if (opt.body) headers['Content-Type'] = 'application/json';

  return fetch('https://api.github.com' + path, {
    method: opt.method || 'GET',
    headers: headers,
    body: opt.body ? JSON.stringify(opt.body) : undefined,
    cache: 'no-store'
  }).then(function(res){
    if (res.status === 404) return { missing: true };
    if (res.ok) return res.json().then(function(j){ return { json: j }; });

    return res.text().then(function(t){
      var msg = '';
      try { msg = JSON.parse(t).message || ''; } catch(e){ msg = String(t).slice(0, 100); }
      var err = new Error('GitHub ' + res.status + (msg ? '：' + msg : ''));
      err.status = res.status;
      throw err;
    });
  });
}

function ghFilePath(){
  var c = ghCfg();
  return (c.path || 'workbench-sync.json').replace(/^\/+/, '');
}
function ghBranch(){
  return ghCfg().branch || 'main';
}

/* 读远端。没有文件返回 null（第一次用，不是错）。 */
async function ghPull(){
  var c = ghCfg();
  var r = await ghApi('/repos/' + c.owner + '/' + c.repo + '/contents/'
    + ghFilePath().split('/').map(encodeURIComponent).join('/')
    + '?ref=' + encodeURIComponent(ghBranch()));

  if (r.missing) return null;
  var txt = b64dec(r.json.content || '');
  if (!txt.trim()) return null;
  var data = JSON.parse(txt);
  data.__sha = r.json.sha;
  return data;
}

/* 写远端。sha 是乐观锁：不是最新版 GitHub 直接拒，避免悄悄覆盖另一台设备的改动。 */
async function ghPut(sha){
  var c = ghCfg();
  var payload = {
    v: 2,
    devId: S.devId,
    savedAt: Date.now(),
    todos: S.todos,
    inbox: S.inbox,
    notes: S.notes || []
  };
  var text = JSON.stringify(payload, null, 1);
  /* Contents API 的硬上限。超了不会有半个文件，是整次拒绝，所以提前说清楚。 */
  if (text.length > 700 * 1024) {
    throw new Error('数据已经 ' + Math.round(text.length / 1024) + 'KB，超过这条通道的安全线（700KB）');
  }

  var body = {
    message: 'sync ' + new Date().toISOString().slice(0, 16).replace('T', ' ') + ' · ' + S.devId.slice(-4),
    content: b64enc(text),
    branch: ghBranch()
  };
  if (sha) body.sha = sha;

  var r = await ghApi('/repos/' + c.owner + '/' + c.repo + '/contents/'
    + ghFilePath().split('/').map(encodeURIComponent).join('/'),
    { method: 'PUT', body: body });

  return r.json && r.json.content ? r.json.content.sha : null;
}

/* 推的时候撞了车（另一台设备刚写完）：重拉、合并、再推一次。
   不重试的话，那一次冲突就等于「我这台的改动丢了」。 */
async function ghPutWithRetry(sha){
  try {
    return await ghPut(sha);
  } catch(e){
    if (e.status !== 409 && e.status !== 422) throw e;
    var cur = await ghPull();
    if (cur) mergeInto(cur);
    save();
    return await ghPut(cur ? cur.__sha : null);
  }
}

/* mode: 'both' | 'up' | 'down'，跟文件通道同一套语义 */
async function ghSync(mode, opt){
  opt = opt || {};
  if (GH.busy) return;
  if (!ghReady()) { toast('先把仓库和 token 填上'); return; }

  GH.busy = true; GH.note = '';
  render({});
  try {
    var st = null;

    if (mode !== 'up') {
      var remote = await ghPull();
      if (remote) {
        st = mergeInto(remote);
      } else if (mode === 'down') {
        GH.note = '仓库里还没有这个文件，这台设备可能是第一个';
      }
    }

    if (mode !== 'down') {
      /* 推之前先拿一次最新的 sha —— 拉取到现在可能已经过了几秒 */
      var cur = await ghPull();
      if (cur && mode === 'both') {
        /* ghPull 已经合并过，这里只补一条：pull 之后别人又写的，也要并进来 */
        st = st || { add:0, upd:0, tomb:0, same:0 };
      }
      await ghPutWithRetry(cur ? cur.__sha : null);
      GH.at = Date.now();
    }

    sweep();
    save();
    GH.busy = false;
    render({});

    if (opt.silent) {
      if (st && (st.add || st.upd || st.tomb)) {
        toast('从 GitHub 合并了 ' + (st.add + st.upd) + ' 条');
      }
      return;
    }
    if (st && (st.add || st.upd || st.tomb)) {
      toast('同步完成：新增 ' + st.add + ' · 更新 ' + st.upd
        + (st.tomb ? ' · 删除 ' + st.tomb : '') + ' · 未变 ' + st.same);
    } else if (st) {
      toast('两边一致，没有要合的东西');
    } else {
      toast('已写入 GitHub');
    }
  } catch(e){
    GH.busy = false;
    GH.note = e.message || String(e);
    render({});
    toast('GitHub 同步失败：' + GH.note);
  }
}

/* 启动时悄悄试一次。没网 / token 失效就安静退出，不弹东西打扰。 */
async function ghAutocheck(){
  if (!ghReady()) return;
  try {
    var remote = await ghPull();
    if (!remote) return;
    var emptyLocal = !S.todos.length && !S.inbox.length;
    var st = mergeInto(remote);
    if (emptyLocal || st.add || st.upd || st.tomb) {
      save(); render({});
      toast('从 GitHub 恢复了 ' + (st.add + st.upd) + ' 条' + (st.tomb ? '，删除 ' + st.tomb : ''));
    }
  } catch(e){ /* 静默 */ }
}

/* ================= media.js ================= */
/* ---------- media.js ----------
   把「一行 URL」变成「能看的东西」。三类：
     1. 视频      B 站 / YouTube / Vimeo / 直链 mp4 → iframe 或 <video>
     2. 图片      png jpg gif webp svg → <img>
     3. 两个外站  飞书文档、WPS 云文档 → 卡片跳转（它们禁 iframe，见下）

   为什么飞书和 WPS 不给嵌：2026-11-18 实测
     docs.feishu.cn → x-frame-options: DENY
     飞书官方 FAQ 自认 iframe 内 cookie 不可用、扫码都登不上
   WPS 同理（自家站点靠登录态）。这类只做「点开去那边看」，不硬塞。

   ⚠️ B 站没有返 x-frame-options，所以能嵌。哪天它加了，这里会变成一块空白——
      所以每个 iframe 下面都留一行原文链接，页一坏就能点过去。 */

/* 视频源的识别规则。顺序有讲究：先匹配具体的，再匹配通用的。 */
var MEDIA_RULES = [
  {
    k: 'bili',
    re: /^https?:\/\/(?:www\.)?bilibili\.com\/video\/(BV[0-9A-Za-z]+)/,
    frame: function(m){
      return 'https://player.bilibili.com/player.html?bvid=' + m[1]
        + '&autoplay=0&high_quality=1&danmaku=0';
    },
    label: 'B 站'
  },
  {
    k: 'bili',
    re: /^https?:\/\/b23\.tv\/([0-9A-Za-z]+)/,
    frame: null,
    label: 'B 站短链'
  },
  {
    k: 'yt',
    re: /^https?:\/\/(?:www\.|m\.)?youtube\.com\/watch\?v=([\w-]{6,})/,
    frame: function(m){ return 'https://www.youtube.com/embed/' + m[1]; },
    label: 'YouTube'
  },
  {
    k: 'yt',
    re: /^https?:\/\/youtu\.be\/([\w-]{6,})/,
    frame: function(m){ return 'https://www.youtube.com/embed/' + m[1]; },
    label: 'YouTube'
  },
  {
    k: 'vimeo',
    re: /^https?:\/\/(?:www\.)?vimeo\.com\/(\d+)/,
    frame: function(m){ return 'https://player.vimeo.com/video/' + m[1]; },
    label: 'Vimeo'
  },
  {
    k: 'mp4',
    re: /^https?:\/\/\S+\.(?:mp4|webm|ogg)(?:\?\S*)?$/i,
    video: true,
    label: '视频文件'
  },
  {
    k: 'img',
    re: /^https?:\/\/\S+\.(?:png|jpe?g|gif|webp|svg|avif)(?:\?\S*)?$/i,
    img: true,
    label: '图片'
  },
  {
    k: 'feishu',
    re: /^https?:\/\/([\w-]+\.)?(feishu\.cn|larksuite\.com|feishu-boe\.cn)\/\S*/,
    label: '飞书文档'
  },
  {
    k: 'wps',
    re: /^https?:\/\/(?:www\.)?(kdocs\.cn|wps\.cn|docer\.wps\.cn)\/\S*/,
    label: 'WPS 云文档'
  },
  {
    /* mermaid.ink/img/<base64> 这种，本身就是一张图 */
    k: 'img',
    re: /^https?:\/\/mermaid\.ink\/(?:img|svg)\//,
    img: true,
    label: 'Mermaid 图'
  }
];

function detectMedia(url){
  var u = String(url || '').trim();
  if (!/^https?:\/\//i.test(u)) return null;
  for (var i = 0; i < MEDIA_RULES.length; i++) {
    var r = MEDIA_RULES[i];
    var m = u.match(r.re);
    if (!m) continue;
    return {
      k: r.k,
      label: r.label,
      url: u,
      frame: r.frame ? r.frame(m) : null,
      video: !!r.video,
      img: !!r.img
    };
  }
  return null;
}

/* 一段文本里混着普通文字和链接时，只取第一个链接判类型。
   返回 null 表示「这不是一条媒体」，按普通文本处理。 */
function mediaOfText(text){
  var t = String(text || '').trim();
  var m = t.match(/https?:\/\/\S+/);
  if (!m) return null;
  var hit = detectMedia(m[0]);
  if (!hit) return null;
  /* 只有整条就是一个链接才当媒体，否则「看看这个 https://… 怎么样」会被吞掉 */
  return hit.url === t ? hit : null;
}

/* ---------- 渲染 ---------- */

function mediaBlock(item){
  var src = item.src;
  var h = '<div class="md1">';

  if (src.img) {
    h += '<a class="md-img" href="' + esc(src.url) + '" target="_blank" rel="noopener noreferrer">'
      + '<img src="' + esc(src.url) + '" alt="" loading="lazy"></a>';
  } else if (src.video) {
    h += '<video class="md-vid" controls preload="metadata" src="' + esc(src.url) + '"></video>';
  } else if (src.frame) {
    /* 竖屏视频（B 站 / YouTube Shorts）在 iframe 里会上下留大黑边，这里按比例给高度 */
    h += '<div class="md-fr"><iframe src="' + esc(src.frame) + '" loading="lazy"'
      + ' allow="accelerometer; encrypted-media; picture-in-picture; fullscreen"'
      + ' allowfullscreen referrerpolicy="no-referrer"></iframe></div>';
  } else {
    /* 飞书 / WPS / B 站短链：点开去那边 */
    h += '<a class="md-go" href="' + esc(src.url) + '" target="_blank" rel="noopener noreferrer">'
      + '<span class="md-go-t">' + esc(src.label) + '</span>'
      + '<span class="md-go-u">' + esc(src.url.replace(/^https?:\/\//, '').slice(0, 48)) + '</span>'
      + '<span class="md-go-a">打开</span></a>';
  }

  h += '<div class="md1-f"><span class="md1-k">' + esc(src.label) + '</span>';
  if (item.text && item.text !== src.url) {
    h += '<span class="md1-t">' + esc(item.text) + '</span>';
  }
  h += '</div></div>';
  return h;
}

/* 笔记正文：Markdown 渲染 + 净化。
   净化这一步不能省 —— 笔记内容会被存进同步文件，那个文件是能被别人写进来的
   （共享仓库 / 另一台设备 / 手改）。不净化就等于给脚本执行开了个口子。 */
function mdRender(md){
  if (typeof marked === 'undefined') return '<pre>' + esc(md) + '</pre>';
  var raw;
  try {
    raw = marked.parse(String(md || ''), { breaks: true, gfm: true });
  } catch(e){
    return '<pre>' + esc(md) + '</pre>';
  }
  if (typeof DOMPurify !== 'undefined') {
    /* 允许保留图片、链接、表格；不放开 iframe/script/style */
    return DOMPurify.sanitize(raw, {
      USE_PROFILES: { html: true },
      ADD_ATTR: ['target', 'rel'],
      FORBID_TAGS: ['iframe', 'script', 'style', 'form', 'input'],
      FORBID_ATTR: ['style', 'onerror', 'onload']
    });
  }
  return '<pre>' + esc(md) + '</pre>';
}

/* 把正文里的 mermaid 代码块换成图。
   mermaid.ink 是纯 GET 的渲染服务，2026-11-18 实测：POST 一段流程图过去
   返回 image/png 200 / 7.6KB。它不渲染中文以外的复杂布局，但流程图、时序图、思维导图都行。
   好处是不用把 3.5MB 的 mermaid.js 塞进来；坏处是断网就看不到图 —— 所以留了代码块原文。 */
function mermaidSrc(code){
  var state = { code: code, mermaid: JSON.stringify({ theme: 'default' }) };
  var b64 = b64enc(JSON.stringify(state)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return 'https://mermaid.ink/img/' + b64 + '?type=png';
}

/* node 测试用出口：浏览器里 module 不存在，整段跳过 */
if (typeof module !== "undefined" && module.exports) {
  module.exports = { detectMedia: detectMedia, mediaOfText: mediaOfText, MEDIA_RULES: MEDIA_RULES };
}

/* ---------- ui.js ----------

/* 输入区。id 固定为 inp / add，actions.js 靠这两个 id 取值。

   这里回车是添加、Shift+回车是换行——跟滴答、Things 一样，不跟记事本一样。 */
function uiEntry(placeholder, btnText){

    + '<div class="t1">' + esc(t1) + '</div><div class="t2">' + t2 + '</div></div>';

/* 统计卡。n 是数字，k 是标签，hot 让数字用强调色 */

/* 分段控件（三选一之类）。items: [{k, label, n}]，active 是当前 k。

/* ---------- views/quad.js ----------
   四象限：把同一批待办按「重要 × 紧急」切开。不是另一份数据，只是另一个视角。

   布局照滴答清单的实际界面：2×2 撑满屏、每格标题前面一个小色点、

function quadOf(t){ return (t.urg ? 'u' : '-') + (t.imp ? 'i' : '-'); }

function viewQuad(){

/* ================= views/notes.js ================= */
/* ---------- views/notes.js ----------
   笔记：一条笔记 = 一个来源（视频 / 图片 / 飞书文档 / WPS 文档）+ 一段 Markdown。

   为什么不做成「富文本编辑器」：
   富文本要一个能处理光标、选区的编辑器，几万行起步，而且存下来的 HTML 跨版本难兼容。
   Markdown 是纯文本，能进同步文件、能 diff、能在手机上用软键盘改，代价是要认几个符号。
   考虑到这里面大量内容是「贴个视频 + 写两句」，Markdown 够用。

   出处：用户 21:17「喜欢飞书能嵌入视频，喜欢 wps 有思维导图、markdown 文件读取」。
   这两条在网页里都能做到 —— 视频靠官方 iframe，思维导图靠 mermaid 文本，
   Markdown 靠一个 35KB 的解析器。都不是飞书或 WPS 的专利。 */

function notesLive(){
  return (S.notes || []).filter(function(x){ return !x.del; })
    .sort(function(a, b){ return (b.up || b.created) - (a.up || a.created); });
}

function noteCard(n){
  var h = '<div class="nt" data-note="' + esc(n.id) + '">';
  if (n.text) h += '<div class="nt-h">' + esc(n.text) + '</div>';

  /* 来源块：视频/图片/外站卡片，走 media.js */
  if (n.src) h += mediaBlock({ src: n.src, text: '' });

  /* 正文按 Markdown 渲染，mermaid 代码块单独换成图 */
  if (n.body && n.body.trim()) {
    var body = n.body;
    /* 先把 ```mermaid 块摘出来，渲染成图片，再整体走 Markdown */
    body = body.replace(/```mermaid\s*\n([\s\S]*?)```/g, function(_, code){
      var id = 'mm' + Math.random().toString(36).slice(2, 8);
      /* 图床是第三方，哪天挂了就是一张空白 —— 所以带上 onerror 兜底，
         并在图下面一直保留源码。图挂了至少还能看到画的是什么。 */
      return '\n<div class="mmm">'
        + '<img src="' + esc(mermaidSrc(code.trim())) + '" alt="图" loading="lazy"'
        + ' onerror="this.parentNode.classList.add(\'bad\')">'
        + '<div class="mmm-e">图没加载出来（断网或图床挂了），下面是源码</div>'
        + '<div class="mmm-c"><pre>' + esc(code.trim()) + '</pre></div></div>\n';
    });
    h += '<div class="nt-body md">' + mdRender(body) + '</div>';
  }

  h += '<div class="nt-f"><span class="nt-t">' + fmt(n.up || n.created) + '</span>'
    + '<button class="nt-b" data-note-edit="' + esc(n.id) + '">改</button>'
    + '<button class="nt-b nt-x" data-note-del="' + esc(n.id) + '">删</button></div>';
  h += '</div>';
  return h;
}

function viewNotes(){
  var list = notesLive();
  var editing = S.noteEdit;

  var h = '<div class="wrap"><h1 class="page-h">笔记</h1>'
    + '<div class="page-s">' + (list.length ? list.length + ' 条' : '还没有') + '</div>';

  /* 编辑区：新建或改一条 */
  if (editing) {
    var n = editing === 'new' ? null : (S.notes || []).filter(function(x){ return x.id === editing; })[0];
    h += '<div class="nted">'
      + '<div class="nted-r"><span>标题</span><input id="nttitle" placeholder="可留空"'
      + ' autocomplete="off" value="' + esc(n && n.text ? n.text : '') + '"></div>'
      + '<div class="nted-r"><span>来源</span><input id="ntsrc" placeholder="粘贴视频/文档链接，可留空"'
      + ' autocomplete="off" spellcheck="false" value="' + esc(n && n.src ? n.src.url : '') + '"></div>'
      + '<div class="nted-r"><span>正文</span><textarea id="ntbody" rows="6" placeholder="Markdown。&#10;```mermaid 开头的一段会画成图"'
      + ' spellcheck="false">' + esc(n ? (n.body || '') : '') + '</textarea></div>'
      + '<div class="btnrow"><button class="primary" id="ntsave">保存</button>'
      + '<button id="ntcancel">取消</button></div></div>';
  } else {
    h += '<div class="btnrow" style="margin:0 0 4px"><button class="primary" id="ntnew">写一条</button>'
      + '<button id="ntimp">读 md</button>'
      + '<input type="file" id="ntfile" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple hidden></div>';
  }

  if (!list.length && !editing) {

  } else if (!editing || editing !== 'new') {

/* ---------- 读 Markdown 文件 ----------
   一条 md 文件 = 一条笔记。`---` 之间的元信息认得 title / date，其余忽略。
   分批入库而不是一次性 push：几百个文件一起塞进去会把主线程卡死几秒，
   中途失败也不该一条都不剩。 */
function importMdFiles(files){
  var arr = Array.prototype.slice.call(files || []);
  if (!arr.length) return;

  var ok = 0, skip = 0;

  var readOne = function(i){
    if (i >= arr.length) {
      save(); render({top:true});
      toast(skip ? '读入 ' + ok + ' 个，跳过 ' + skip + ' 个（不是 .md）' : '读入 ' + ok + ' 个文件');
      return;
    }
    var f = arr[i];
    if (!/\.(md|markdown|mdown|txt)$/i.test(f.name)) { skip++; readOne(i + 1); return; }

    var fr = new FileReader();
    fr.onload = function(){
      var raw = String(fr.result || '');
      var title = f.name.replace(/\.[^.]+$/, '');
      var body = raw;

      /* 开头的 --- ... --- 里找 title */
      var fm = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);
      if (fm) {
        var t = fm[1].match(/^title:\s*(.+)$/m);
        if (t) title = t[1].trim().replace(/^["']|["']$/g, '');
        body = raw.slice(fm[0].length);
      }
      /* 正文第一行是一级标题就把它提到标题，不然卡片上会重复一次 */
      var h1 = body.match(/^#\s+(.+)\r?\n/);
      if (h1) {
        if (!fm) title = h1[1].trim();
        body = body.replace(/^#\s+.+\r?\n/, '');
      }

      var now = Date.now();
      S.notes.push({
        id: uid(), text: title, src: null, body: body.trim(),
        created: now, up: now, del: 0
      });
      ok++;
      readOne(i + 1);
    };
    fr.onerror = function(){ skip++; readOne(i + 1); };
    fr.readAsText(f);
  };
  readOne(0);
}

/* 绑定放在 render.js 里统一调，和别的视图一样 */
function bindNotes(){
  var $ = function(id){ return document.getElementById(id); };

  if ($('ntimp')) $('ntimp').addEventListener('click', function(){ $('ntfile').click(); });
  if ($('ntfile')) $('ntfile').addEventListener('change', function(e){
    importMdFiles(e.target.files);
    e.target.value = '';
  });

  if ($('ntnew')) $('ntnew').addEventListener('click', function(){
    S.noteEdit = 'new';
    save(); render({top:true});
  });
  if ($('ntcancel')) $('ntcancel').addEventListener('click', function(){
    S.noteEdit = '';
    render({});
  });
  if ($('ntsave')) $('ntsave').addEventListener('click', function(){
    var title = ($('nttitle').value || '').trim();
    var srcRaw = ($('ntsrc').value || '').trim();
    var body = $('ntbody').value || '';

    var src = null;
    if (srcRaw) {
      src = detectMedia(srcRaw);
      if (!src) { toast('这个链接认不出来，可以只写正文'); return; }
    }
    if (!src && !body.trim() && !title) { toast('标题、来源、正文总得有一个'); return; }

    var now = Date.now();
    var cur = S.noteEdit === 'new' ? null
      : (S.notes || []).filter(function(x){ return x.id === S.noteEdit; })[0];

    if (cur) {
      cur.text = title;
      cur.src = src;
      cur.body = body;
      cur.up = now;
    } else {
      S.notes.push({ id: uid(), text: title, src: src, body: body, created: now, up: now, del: 0 });
    }
    S.noteEdit = '';
    save(); render({top:true});
    toast(cur ? '已更新' : '已存下');
  });

/* ================= render.js ================= */
/* ---------- render.js ----------
   路由与装配：选视图、算导航数字、把 HTML 塞进 #body、绑一次性事件。

   加视图的流程：在 config.js 的 VIEWS 里注册 → 在 views/ 下写函数并
   VIEW_FN[k]=... 。这里不用改。
*/

function counts(){
  var open = 0, done = 0;
  S.todos.forEach(function(t){ if (t.del) return; t.done ? done++ : open++; });
  var ib = 0;
  S.inbox.forEach(function(t){ if (!t.del) ib++; });
  return {open:open, done:done, inbox:ib};
}

/* 导航上的角标。返回空串就不显示。 */
function navBadge(k, c){
  if (k === 'today') return c.open > 0 ? String(c.open) : '';
  if (k === 'inbox') return c.inbox > 0 ? String(c.inbox) : '';
  return '';
}

function renderNav(){
  var c = counts();
  document.getElementById('nav').innerHTML = VIEWS.map(function(v){
    return '<button class="nav' + (S.view === v.k ? ' on' : '') + '" data-view="' + v.k + '">'
      + (IC[v.ic] || '') + '<span class="lb">' + v.label + '</span>'
      + '<span class="cnt">' + navBadge(v.k, c) + '</span></button>';
  }).join('');

  var cur = VIEWS.filter(function(v){ return v.k === S.view; })[0] || VIEWS[0];
  document.getElementById('crumb').textContent = '/ ' + cur.label;
  document.title = cur.label + ' · 我的工作台';
}

/* 只给当前视图绑事件。每次 render 后 DOM 是新的，绑旧的会泄漏。 */
var pendingFocus = false;

function bindView(){
  var inp = document.getElementById('inp');
  if (inp) {
    inp.addEventListener('keydown', function(e){
      /* 输入法组字时按回车是在选字，不能当成提交 */
      var composing = e.isComposing || e.keyCode === 229;
      if (e.key !== 'Enter' || composing) return;
      /* Shift+Enter 换行：写长一点的笔记或粘贴后手动整理时要用 */
      if (e.shiftKey) return;
      e.preventDefault();
      submit();
    });

    /* 框自己长高：内容多了就多显示几行，最多 8 行，再多就滚动 */
    var autosize = function(){
      inp.style.height = 'auto';
      var h = Math.min(inp.scrollHeight, 160);
      inp.style.height = h + 'px';
    };
    inp.addEventListener('input', autosize);
    setTimeout(autosize, 0);

    var btn = document.getElementById('add');
    if (btn) btn.addEventListener('click', submit);
    bindPaste(inp, '');
    if (pendingFocus) { pendingFocus = false; setTimeout(function(){ inp.focus(); }, 0); }
  }

  /* 四象限格内输入框：不叫 inp（那个 id 是主输入框专用的），
     回车走 quadSubmit，才能带上这一格的标记。 */
  Array.prototype.forEach.call(document.querySelectorAll('[data-qin]'), function(box){
    box.addEventListener('keydown', function(e){
      if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        quadSubmit(box.dataset.qin);
      }
    });
    bindPaste(box, box.dataset.qin);
  });
  var qi = document.querySelector('[data-qin]');
  if (qi) setTimeout(function(){ qi.focus(); }, 0);


  bindSyncView();
  if (S.view === 'notes') bindNotes();
}

function currentView(){
  var fn = VIEW_FN[S.view];
  if (fn) return fn();
  if (S.view === 'sync') return viewSync();
  return viewSoon(S.view);
}

function render(opts){
  opts = opts || {};
  if (opts.focus) pendingFocus = true;
  renderNav();
  var body = document.getElementById('body');
  var keep = opts.top ? 0 : body.scrollTop;
  /* 四象限要撑满屏、自己管滚动，所以把 .body 的 padding 与滚动交给 .qwrap */
  body.classList.toggle('qmode', S.view === 'quad');
  body.innerHTML = currentView();
  bindView();
  renderSheet();
  body.scrollTop = keep;

  /* 右下角 + 是每次渲染重建的，必须在这里绑；之前放在 bindView 里，
     而 bindView 在 DOM 换掉之前就跑了，拿到的是上一屏那个已废弃的节点。 */
  var fab = document.getElementById('fab');
  if (fab) fab.addEventListener('click', openFab);
}

/* ---------- 底部浮层：选象限 / 收集箱清理 ----------
   滴答点 + 之后先问「放进哪一格」，这里照做：四个象限按钮 + 一个收集箱按钮。
   收集箱清理也复用一个浮层，因为两者都是「从底部升起、选一下就走」。 */
function renderSheet(){
  var host = document.getElementById('sheet');
  if (!host) return;
  var h = '';

  if (S.picker) {
    h += '<div class="sh"><div class="sh-h">放到哪一格</div>';
    QUADS.forEach(function(q){
      h += '<button class="sh-b" data-pick="' + q.k + '">'
        + '<i class="qd" style="background:' + q.c + '"></i>' + esc(q.label) + '</button>';
    });
    h += '<button class="sh-b" data-pick="inbox">'
      + '<i class="qd qi">' + IC.inbox + '</i>收集箱</button>';
    h += '<button class="sh-x" data-close="1">取消</button></div>';
  }

  if (S.sheet === 'inbox') {
    var list = S.inbox.filter(function(x){ return !x.del; })
      .sort(function(a,b){ return b.created - a.created; });
    h += '<div class="sh"><div class="sh-h">收集箱 · ' + list.length + ' 条</div>';
    if (!list.length) {
      h += '<div class="sh-e">空的</div>';
    } else {
      h += '<div class="sh-list">' + list.map(function(x){
        return '<div class="sh-i"><div class="sh-t">' + esc(x.text) + '</div>'
          + '<div class="sh-a">'
          + QUADS.map(function(q){
              return '<button data-move="' + x.id + '" data-to="' + q.k + '"'
                + ' title="' + esc(q.label) + '"><i class="qd" style="background:' + q.c + '"></i></button>';
            }).join('')
          + '<button class="sh-del" data-del="' + x.id + '" title="删掉">' + IC.x + '</button>'
          + '</div></div>';
      }).join('') + '</div>';
    }
    h += '<div class="sh-x" data-close="1">收起</div></div>';
  }

  host.innerHTML = h;
  host.classList.toggle('on', !!h);
  var scrim = document.getElementById('sheet-scrim');
  if (scrim) scrim.classList.toggle('on', !!h);
}

/* ================= actions.js ================= */
/* ---------- actions.js ----------
   写操作：增删改、导入导出、事件委托。删一律留墓碑，不真删。 */

/* ---------- 动作 ---------- */
function submit(){
  var inp = document.getElementById('inp');
  if (!inp) return;
  var v = inp.value.trim();
  if (!v) return;

  /* 整条就是一个视频链接 → 存成笔记。这是「想收藏这个视频」的场景，
     硬变成一条叫「https://…」的任务，第二天自己都不知道那行是什么。 */
  var media = mediaOfText(v);
  if (media) {
    inp.value = '';
    submitMedia(v);
    return;
  }

  var now = Date.now();
  if (S.view === 'inbox') {
    S.inbox.push({id:uid(), text:v, created:now, up:now, del:0});
  } else {
    var star = false;
    if (/^[!！]/.test(v)) { star = true; v = v.replace(/^[!！]\s*/, ''); }
    if (!v) return;
    S.todos.push({id:uid(), text:v, done:false, doneAt:0, star:star,
                  urg:0, imp:0, created:now, up:now, del:0});
  }
  /* 交完把输入区收回去，否则上次拉高过的框一直占着屏 */
  S.rows = 1;
  save();
  render({focus:true, top:true});
}

/* ---------- 粘贴多行：每行一条 ----------
   从飞书、备忘录、微信里复制一串待办，粘进来直接变成 N 条。
   飞书的编辑器本身嵌不进来（X-Frame-Options: DENY + 第三方 cookie 限制），
   但它的**产出**可以喂进来——这是「在别处写、在这里变成结构」唯一能真做到的形态。

   顺手吃掉常见的前缀：`- ` `* ` `1. ` `[ ] ` `[x] `，留着它们当任务名很难看。 */
/* 把一段多行文本洗干净：拆行、去掉列表前缀、丢空行。
   `- 买牛奶` `* 买牛奶` `1. 买牛奶` `[ ] 买牛奶` 在这个输入框里都只是「买牛奶」。 */
function cleanLines(text){
  return String(text || '').split(/\r?\n/).map(function(line){
    return line
      .replace(/^\s*[-*+•]\s+/, '')
      .replace(/^\s*\d+[.)]\s+/, '')
      .replace(/^\s*\[[ xX]?\]\s*/, '')
      .trim();
  }).filter(function(x){ return !!x; });
}

/* opt.quad 指定格子（为空则按 opt.inbox 决定去收集箱还是普通待办） */
function addMany(lines, opt){
  opt = opt || {};
  var q = opt.quad && QUAD_BY[opt.quad] ? QUAD_BY[opt.quad] : null;
  var now = Date.now();
  var n = 0;

  lines.forEach(function(t){
    var star = false;
    if (/^[!！]/.test(t)) { star = true; t = t.replace(/^[!！]\s*/, ''); }
    if (!t) return;

    if (!q && opt.inbox) {
      S.inbox.push({id:uid(), text:t, created:now, up:now, del:0});
    } else {
      S.todos.push({id:uid(), text:t, done:false, doneAt:0, star:star,
                    urg:q ? q.urg : 0, imp:q ? q.imp : 0, created:now, up:now, del:0});
    }
    n++;
  });
  if (n) save();
  return n;
}

/* 粘贴多行：至少两行才拦，单行留给浏览器默认行为 */
function pasteLines(text, quadKey){
  var lines = cleanLines(text);
  if (lines.length < 2) return 0;
  return addMany(lines, { quad: quadKey, inbox: !quadKey && S.view === 'inbox' });
}

/* 这段粘贴到底是「一串待办」还是「一段文字」？
   两条判据：行数 >= 2，且每行都短、不带句号/逗号收尾的长句。
   判错的代价不对称——一串任务被当成一段，用户还得再删一次；
   一段文字被拆成十几条，那是灾难。所以宁可保守：拿不准就当一段。 */
function looksLikeList(lines){
  if (lines.length < 2) return false;
  return lines.every(function(x){
    return x.length <= 30 && !/[。！？；]$/.test(x);
  });
}

/* ---------- URL 入口：?add=… ----------
   这是「接别处的东西进来」最通用的一刀：
     iOS 快捷指令分享任何文本 → 打开这个链接 → 直接进收集箱
     安卓任何 App 「分享 → 复制」再用桌面快捷方式打开同样有效
     桌面浏览器可以用书签小工具拼这个 URL
   带上 &to=do|plan|deleg|drop 就直接落进那一格。
   收完立刻把 query 擦掉，否则刷新一次就重复入库一次。 */
function catchUrlAdd(){
  try {
    var p = new URLSearchParams(location.search);
    var txt = p.get('add') || p.get('t') || p.get('text') || '';
    if (!txt) return;

    var to = (p.get('to') || '').trim();
    var lines = cleanLines(txt);
    /* 没指定格子就进收集箱 —— 这是「收集」这个词的字面意思，
       先收下，回头再决定放哪一格。 */
    var n = addMany(lines, { quad: to, inbox: !to });

    /* 不管有没有加成功，query 都得清掉 */
    history.replaceState(null, '', location.pathname + location.hash);

    if (!n) { toast('链接里没有可用的内容'); return; }
    if (!to && S.view !== 'inbox') { S.view = 'inbox'; save(); }
    render({top:true});
    toast('收到 ' + n + ' 条');
  } catch(e){}
}

/* 给一个输入框挂上两条粘贴规则。
   quadKey 为空表示这是主输入框——主输入框还能接「一段文字」存成笔记。
   格内输入框只收任务，所以永远是拆条。 */
function bindPaste(el, quadKey){
  el.addEventListener('paste', function(e){
    var cd = e.clipboardData;
    if (!cd) return;

    var files = cd.files;
    if (files && files.length) {
      var img = Array.prototype.filter.call(files, function(f){ return /^image\//.test(f.type); })[0];
      if (img) { e.preventDefault(); toast('图片先存不了，只收文字'); return; }
    }

    var text = cd.getData('text/plain');

    /* 一、整段是一个链接 → 存成媒体。视频放得进来、飞书 WPS 给卡片。
          这条必须在「多行拆条」之前判，否则一个带标题的链接会被拆散。 */
    if (text && text.indexOf('\n') < 0) {
      var media = quadKey ? null : mediaOfText(text);
      if (media) { e.preventDefault(); submitMedia(text); return; }
    }

    /* 二、多行文本。主输入框要先问一句：这是任务清单，还是一段话？ */
    if (text && text.indexOf('\n') >= 0) {
      var lines = cleanLines(text);
      if (quadKey || looksLikeList(lines)) {
        var n = pasteLines(text, quadKey);
        if (n) {
          e.preventDefault();
          render({top:true});
          refocus(quadKey);
          toast('粘进来 ' + n + ' 条');
        }
        return;
      }
      /* 不像清单：留给浏览器默认行为，文字原样留在框里，Shift+回车继续写 */
      setTimeout(function(){
        var box = document.getElementById('inp');
        if (box) box.dispatchEvent(new Event('input'));
      }, 0);
      return;
    }

    /* 一行的普通文字，交给浏览器 */
  });
}

function refocus(quadKey){
  var again = quadKey ? document.querySelector('[data-qin="' + quadKey + '"]')
                      : document.getElementById('inp');
  if (again) { again.value = ''; again.focus(); }
}

/* 存一段笔记。带链接的整段文本走这里，正文可选。 */
function submitMedia(text){
  var src = mediaOfText(text);
  if (!src) { toast('这个链接认不出来'); return; }
  var now = Date.now();
  S.notes.push({
    id: uid(), text: '', src: src, body: '',
    created: now, up: now, del: 0
  });
  S.rows = 1;
  S.view = 'notes';
  save(); render({top:true, focus:true});
  toast('存成笔记：' + src.label);
}

/* 主输入框提交：一行是任务，多行不像清单时也可以当一条任务（比如带标点的长句） */
/* 象限内联添加：输入框在该格里，提交时直接带上这一格的 urg/imp。
   注意不能复用 submit()——那个靠 S.view 判断往 todos 还是 inbox 里塞，
   在四象限页会把事塞进收件箱。这里必须自己写。 */
function quadSubmit(k){
  var box = document.querySelector('.qc[data-q="' + k + '"]');
  if (!box) return;
  var inp = box.querySelector('input');
  var v = inp ? inp.value.trim() : '';
  if (!v) { if (inp) inp.focus(); return; }
  var q = QUAD_BY[k];
  var now = Date.now();
  var star = false;
  if (/^[!！]/.test(v)) { star = true; v = v.replace(/^[!！]\s*/, ''); }
  if (!v) return;
  S.todos.push({id:uid(), text:v, done:false, doneAt:0, star:star,
                urg:q.urg, imp:q.imp, created:now, up:now, del:0});
  /* 连着记几件事时不要把输入框收掉；只有点「添加」才收 */
  save(); render();
  var again = document.querySelector('.qc[data-q="' + k + '"] input');
  if (again) again.focus();
}

/* 点右下角 + → 先问放进哪一格。滴答也是这个流程。 */
function openFab(){
  S.picker = true;
  renderSheet();
}

/* 选中格子后，把这一格切到「可录入」状态，输入框自动聚焦 */
function pickQuad(k){
  S.picker = false;
  if (k === 'inbox') {
    S.sheet = 'inbox';
    renderSheet();
    return;
  }
  S.addQuad = (S.addQuad === k) ? '' : k;
  save(); render();
}

/* 收集箱条目直接归到某一格：原地改标记，换到 todos 里，收集箱那条留墓碑 */
function moveToQuad(id, k){
  var item = null;
  S.inbox.forEach(function(x){ if (x.id === id && !x.del) item = x; });
  if (!item) return;
  var q = QUAD_BY[k];
  item.del = 1;
  bumpUp(item);
  var now = Date.now();
  S.todos.push({id:uid(), text:item.text, done:false, doneAt:0, star:false,
                urg:q.urg, imp:q.imp, created:now, up:now, del:0});
  save(); render();
  toast('已放进「' + q.label + '」');
}

function findTodo(id){
  for (var i=0;i<S.todos.length;i++) if (S.todos[i].id === id) return S.todos[i];
  return null;
}

/* 行内加在某个象限后，容器变窄，只留「取消象限标记」和「删」；勾选框留着。 */
document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest(
    '[data-view],[data-tog],[data-star],[data-del],[data-conv],[data-urg],[data-imp],[data-addq]'
    + ',[data-pick],[data-inbox],[data-move],[data-close]') : null;

  if (!t) return;

  if (t.dataset.close) {
    S.picker = false; S.sheet = '';
    renderSheet();
    return;
  }
  if (t.dataset.pick) { pickQuad(t.dataset.pick); return; }
  if (t.dataset.inbox) { S.sheet = 'inbox'; save(); renderSheet(); return; }
  if (t.dataset.move) { moveToQuad(t.dataset.move, t.dataset.to); return; }

  if (t && t.dataset.view) {
    S.view = t.dataset.view;
    document.getElementById('app').classList.remove('drawer');
    save(); render({top:true});
    return;
  }
  if (t && t.dataset.addq) {
    quadSubmit(t.dataset.addq);
    return;
  }
  if (t && t.dataset.urg) {
    var tu = findTodo(t.dataset.urg);
    if (tu) { tu.urg = tu.urg ? 0 : 1; bumpUp(tu); save(); render(); }
    return;
  }
  if (t && t.dataset.imp) {
    var ti = findTodo(t.dataset.imp);
    if (ti) { ti.imp = ti.imp ? 0 : 1; bumpUp(ti); save(); render(); }
    return;
  }
  if (t && t.dataset.tog) {
    var todo = findTodo(t.dataset.tog);
    if (todo) {
      todo.done = !todo.done;
      todo.doneAt = todo.done ? Date.now() : 0;
      bumpUp(todo);
      save(); render();
    }
    return;
  }
  if (t && t.dataset.star) {
    var td = findTodo(t.dataset.star);
    if (td) { td.star = !td.star; bumpUp(td); save(); render(); }
    return;
  }
  if (t && t.dataset.del) {
    var id = t.dataset.del;
    var gone = null;
    S.todos.concat(S.inbox).forEach(function(x){ if (x.id === id) gone = x; });
    if (!gone) return;
    /* 不真删，留墓碑。真删了另一台设备一同步就把它复活了。 */
    gone.del = 1;
    bumpUp(gone);
    save(); render();
    var brief = gone.text.length > 14 ? gone.text.slice(0,14) + '…' : gone.text;
    toast('已删除「' + brief + '」', function(){
      gone.del = 0;
      bumpUp(gone);
      save(); render();
    });
    return;
  }
  if (t && t.dataset.conv) {
    var id2 = t.dataset.conv;
    var item = null;
    S.inbox.forEach(function(x){ if (x.id === id2) item = x; });
    if (item) {
      item.del = 1;
      bumpUp(item);
      var tnow = Date.now();
      S.todos.push({id:uid(), text:item.text, done:false, doneAt:0, star:false,
                    urg:0, imp:0, created:tnow, up:tnow, del:0});
    }
    save(); render();
    return;
  }
});

document.getElementById('burger').addEventListener('click', function(){
  document.getElementById('app').classList.add('drawer');
});
document.getElementById('scrim').addEventListener('click', function(){
  document.getElementById('app').classList.remove('drawer');
});
document.getElementById('sheet-scrim').addEventListener('click', function(){
  S.picker = false; S.sheet = '';
  renderSheet();
});
document.getElementById('fold').addEventListener('click', function(){
  S.mini = !S.mini;
  document.getElementById('app').classList.toggle('mini', S.mini);
  save();
});
document.getElementById('undo').addEventListener('click', function(){
  var fn = toastFn;
  hideToast();
  if (fn) fn();
});
document.getElementById('exp').addEventListener('click', function(){
  var data = JSON.stringify({v:1, exportedAt:new Date().toISOString(), todos:S.todos, inbox:S.inbox}, null, 2);
  var blob = new Blob([data], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '我的工作台-' + dayKey() + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('已导出 JSON，文件在下载目录里');
});

/* 导入：不覆盖，走 mergeInto 逐条比 up。导错文件不会把现有数据弄丢。 */
document.getElementById('imp').addEventListener('click', function(){
  document.getElementById('impfile').click();
});
document.getElementById('impfile').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  f.text().then(function(txt){
    var d;
    try { d = JSON.parse(txt); } catch(err){ throw new Error('不是合法的 JSON'); }
    if (!d || (!Array.isArray(d.todos) && !Array.isArray(d.inbox))) {
      throw new Error('里面没有 todos / inbox 这两个数组');
    }
    var st = mergeInto({ todos: d.todos || [], inbox: d.inbox || [] });
    save(); render();
    toast('已合并：新增 ' + st.add + ' · 更新 ' + st.upd
      + (st.tomb ? ' · 删除 ' + st.tomb : '') + ' · 未变 ' + st.same);
  }).catch(function(err){
    toast('导入失败：' + (err.message || '文件读不出来'));
  });
});

/* ================= main.js ================= */
/* ---------- main.js ----------
   启动：读盘、首屏提示、悄悄看一眼远端、自动聚焦。 */

/* ---------- 启动 ---------- */
S = load();
document.getElementById('app').classList.toggle('mini', !!S.mini);
if (!CAN_SAVE) {
  var st0 = document.getElementById('st');
  if (st0) st0.textContent = '临时模式 · 关掉就没了';
  var dn = document.querySelector('.dot');
  if (dn) { dn.style.background = '#c08a2e'; }
}
// 跨天：隔夜回来，「今日」要是新的
var bootDay = dayKey();
setInterval(function(){
  if (dayKey() !== bootDay) { bootDay = dayKey(); render(); }
}, 60000);

/* 首屏无内容时给一条提示，避免"空白不知道干什么" */
render();

/* 从分享链接进来（?add=…）：先入库，再决定看哪一屏 */
catchUrlAdd();

/* 上一次连着同步文件夹的话，悄悄看一眼远端有没有更新 */
setTimeout(autocheck, 900);
/* GitHub 通道稍晚一点试，别跟文件夹通道抢首次请求 */
setTimeout(ghAutocheck, 1700);

/* 输入框首次自动聚焦（桌面） */
if (window.innerWidth > 860 && S.view === 'today') {
  var i0 = document.getElementById('inp');
  if (i0 && !S.todos.length) setTimeout(function(){ i0.focus(); }, 120);
}
})();
